---
# defaults file for avd_to_containerlab

# Root directory where to build output structure
root_dir: '{{ inventory_dir }}'

# AVD configurations output
# Main output directory
output_dir_name: 'intended'
output_dir: '{{ root_dir }}/{{ output_dir_name }}'

# Output for structured YAML files:
structured_dir_name: 'structured_configs'
structured_dir: '{{ output_dir }}/{{ structured_dir_name }}'

# Defaults for running containerlab
containerlab_dir_name: 'simulation'
containerlab_dir: '{{ output_dir }}/{{ containerlab_dir_name }}'
containerlab_mode: installed
containerlab_image: ghcr.io/srl-labs/clab
# Optional offline override, defined on SIMULATION hosts/group, e.g. "0.81.0".
# Otherwise create_avd_node_files detects the deployment executable's version.
# containerlab_version: "0.81.0"
containerlab_labname: AVD
containerlab_deploy_on_hosts: true
containerlab_deploy_local: false

# Optional containerlab runtime (only adds --runtime flag when defined and not 'docker')
# Uncomment and set to 'podman' to use Podman backend instead of Docker
# containerlab_runtime: podman
